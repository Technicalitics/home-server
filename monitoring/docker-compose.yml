# Image or environment changes are only applied by recreating containers.
# `docker compose restart` keeps the old image, so use:
#   docker compose pull && docker compose up -d
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - /srv/docker/data/monitoring/prometheus:/prometheus:z
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      glance.parent: monitoring
      glance.name: Prometheus
      glance.icon: /assets/prometheus.png
      glance.url: http://localhost:9090
      glance.description: Metrics database
      glance.id: prometheus

  grafana:
    # >=11.6.11 is the first 11.6 patch that serves the shared React JSX
    # runtime (/react/jsx-runtime) that newer plugins import.
    image: grafana/grafana:11.6.16
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    env_file:
      - .env
    extra_hosts: 
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.server.netbird.cloud
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Plugin auto-update needs no override: the preinstaller only updates
      # within the same major version, so a 1.x plugin is not replaced by a
      # 2.x/3.x one that needs a newer Grafana.
      # WAL mode avoids "database is locked" retries on the SQLite store.
      - GF_DATABASE_WAL=true
      - TZ=${TZ:-UTC}
    volumes:
      - /srv/docker/data/monitoring/grafana:/var/lib/grafana:z
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
    labels:
      glance.parent: monitoring
      glance.name: Grafana
      glance.icon: /assets/grafana.png
      glance.url: https://grafana.server.netbird.cloud
      glance.description: Dashboards & alerting
      glance.id: grafana

  loki:
    # 3.5.1 fixes "negative structured metadata bytes received" error spam
    # (grafana/loki#17371, fixed by PR #17372); 3.5.12 is the latest 3.5 patch.
    image: grafana/loki:3.5.12
    container_name: loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOKI_PORT}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro,z
      - /srv/docker/data/monitoring/loki:/loki:z
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring
    labels:
      glance.parent: monitoring
      glance.name: Loki
      glance.icon: /assets/loki.png
      glance.url: http://localhost:3100
      glance.description: Log aggregation
      glance.id: loki

  alloy:
    image: grafana/alloy:v1.9.2
    container_name: alloy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ALLOY_PORT}:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - /srv/docker/data/monitoring/alloy:/var/lib/alloy/data:z
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    networks:
      - monitoring
    depends_on:
      - loki
    user: "0:0"
    labels:
      glance.parent: monitoring
      glance.name: Alloy
      glance.icon: /assets/alloy.png
      glance.url: http://localhost:12345
      glance.description: Telemetry collector
      glance.id: alloy

  node-exporter:
    # v1.12.0+ bundles procfs v0.21.x, which understands the two-word
    # "gc xpc" XFS stats line emitted by Linux 7.x kernels.
    image: prom/node-exporter:v1.12.1
    container_name: node_exporter
    restart: unless-stopped
    # /proc/<pid>/mountinfo is gated by a ptrace access check (same UID as the
    # target, or CAP_SYS_PTRACE). The image defaults to nobody (65534) while
    # host PID 1 is root, so the filesystem collector gets EACCES and emits
    # no node_filesystem_* metrics at all. Running as root matches the target
    # UID; cap_add alone does not help because Docker does not grant effective
    # capabilities to non-root processes.
    user: "0:0"
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - /run/udev:/run/udev:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.cgroups
    networks:
      - monitoring
    labels:
      glance.parent: monitoring
      glance.name: Node Exporter
      glance.description: Host metrics
      glance.id: node_exporter

  # Per-container CPU/memory/network/filesystem metrics. Docker's own
  # :9323 endpoint only exposes daemon metrics, so this is what feeds the
  # container dashboards.
  cadvisor:
    # Docker Engine 29 uses the containerd image store by default, so
    # `docker info` reports the storage driver as "overlayfs" and the legacy
    # /var/lib/docker/image/overlay2/layerdb tree no longer exists. Up to
    # v0.52.x cAdvisor then fails with "failed to identify the read-write
    # layer ID" and registers no containers at all. The containerd-snapshotter
    # support landed in v0.55.0; v0.55.1 is the newest tag published to gcr.io.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      # No :z here: relabeling / or /sys recursively would touch the host
      # filesystem. privileged mode already runs the container unconfined.
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      # containerd store mode: cAdvisor asks containerd for each container's
      # rootfs path, so it needs the socket and the runtime state dir.
      - /run/containerd:/run/containerd:ro
      - /sys:/sys:ro
      # Not /var/lib/docker: this host's DockerRootDir is /srv/docker-data,
      # which is already visible under /:/rootfs. The path is only read by
      # the legacy (non-containerd) code path.
      - /dev/disk/:/dev/disk:ro
    privileged: true
    networks:
      - monitoring
    labels:
      glance.parent: monitoring
      glance.name: cAdvisor
      glance.description: Container metrics
      glance.id: cadvisor

  # Rootless image: NetBird runs in netstack (userspace) mode. It creates no
  # kernel tun interface and installs no 100.64.0.0/10 route, so containers
  # sharing this network namespace can only reach the tailnet through the
  # built-in SOCKS5 proxy on 127.0.0.1:1080 (see blackbox.yml https_2xx).
  netbird:
    image: netbirdio/netbird:rootless-latest
    container_name: monitoring-netbird
    hostname: monitoring
    restart: unless-stopped
    cap_add: []
    cap_drop:
      - ALL
    devices: []
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run
    environment:
      - NB_SETUP_KEY=${NB_SETUP_KEY}
      - NB_ENABLE_ROSENPASS=true
    volumes:
      - netbird-state:/var/lib/netbird
    ports:
      - "127.0.0.1:9115:9115"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      glance.parent: monitoring
      glance.name: NetBird
      glance.description: NetBird mesh sidecar

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: blackbox_exporter
    restart: unless-stopped
    network_mode: service:netbird
    depends_on:
      netbird:
        condition: service_started
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro,z
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    labels:
      glance.parent: monitoring
      glance.name: Blackbox Exporter
      glance.description: Endpoint probes
      glance.id: blackbox_exporter

networks:
  monitoring:
    driver: bridge

volumes:
  netbird-state:
